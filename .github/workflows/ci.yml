name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      test_suite:
        description: Functional tests to run against BASE_URL
        required: true
        type: choice
        options:
          - smoke
          - all
        default: smoke

jobs:
  tests:
    name: Run pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create BASE_URL config from secret
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          test -n "$BASE_URL" || (echo "BASE_URL secret is required" && exit 1)
          mkdir -p src/config
          printf "BASE_URL = '%s'\n" "$BASE_URL" > src/config/url.py

      - name: Run pytest
        if: github.event_name == 'workflow_dispatch' && inputs.test_suite == 'all'
        run: pytest tests/func -v --alluredir=allure-results

      - name: Run smoke tests
        if: github.event_name == 'workflow_dispatch' && inputs.test_suite != 'all'
        run: pytest tests/func -m smoke -v --alluredir=allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 14
